server {
    listen 80;
    listen [::]:80;
    server_name ai.mockr.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.mockr.com.cn;

    ssl_certificate     /etc/letsencrypt/live/ai.mockr.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.mockr.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # 初始化入口只允许本机访问（避免公网抢注管理员）
    # 完成初始化后，把下面 location 里的 allow/deny 三行删掉即可
    location /setup {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/setup {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3480;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ==================================================================
    # 批次③（2026-09-20）诉求平台 /gqxq/ —— 本行以下**全部为新增 location**，
    # 上方既有 NewAPI 反代（/setup、/api/setup、location /）一字未改。
    # 回滚：删除本段 + rm /etc/nginx/conf.d/gqxq-ratelimit.conf + reload，
    # 或整目录还原 /root/nginx-backup-20260920-0850。
    # ==================================================================

    # --- 入站无鉴权端点：本批不对公网开放（只在 nginx 层封闭，应用层不动） ---
    # 依据：仓库 docs/2026-09-19-入站无鉴权端点防护方案.md（A 内网化/封闭 +
    #       B 限流为上线前必须项，C2 HMAC 验签为目标形态）。
    # 待办：与对接方定下联调窗口后，按方案 A 的来源 IP 白名单 + C2 验签定点
    #       放开；放开前以下入口在公网必须保持 403。
    location = /gqxq/api/v1/external/yijiejieban/appeal { return 403; }
    location = /gqxq/api/v1/external/public-utility/callback { return 403; }
    location = /gqxq/api/v1/external/tianbao/status-callback { return 403; }
    location /gqxq/api/v1/external/ { return 403; }

    # --- API 反代：尾斜杠剥掉 /gqxq 前缀，回源只走 127.0.0.1 回环 ---
    location /gqxq/api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;
        limit_req zone=gqxq_api burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/gqxq-api.access.log;
    }

    # --- 前端 SPA（产物按 vite base=/gqxq/ 构建） ---
    location = /gqxq { return 301 /gqxq/; }
    location /gqxq/ {
        alias /data/gqxq/web/;
        index index.html;
        try_files $uri $uri/ /gqxq/index.html;
        client_max_body_size 1m;
    }

    # ==================================================================
    # lifeline-docking · https://ai.mockr.com.cn/lifeline-docking
    #
    # 2026-09-24 首版；同日调整开放范围（首页 + 知识库只读开放，管理后台封闭）
    #
    # 开放：/lifeline-docking/（首页）、/lifeline-docking/kb/index.html（知识库）
    # 封闭：/admin/**、credentials.html、debug.html、records.html
    #       —— 应用层 /admin/** 无鉴权（README 第六节），故在 Nginx 层 403
    # 调用方入口（限流 10r/s）：
    #       POST /lifeline-docking/data-docking-api/token
    #       POST /lifeline-docking/data-docking-api/execute/api
    #
    # 回滚：删除本段 + rm /etc/nginx/conf.d/lifeline-ratelimit.conf + reload
    # ==================================================================

    # --- 管理后台：应用层无鉴权，公网一律封闭 ---
    location /lifeline-docking/admin/ { return 403; }
    location = /lifeline-docking/credentials.html { return 403; }
    location = /lifeline-docking/debug.html { return 403; }
    location = /lifeline-docking/records.html { return 403; }

    # --- 调用方入口：取令牌 ---
    location = /lifeline-docking/data-docking-api/token {
        proxy_pass http://127.0.0.1:3110/data-docking-api/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 2m;
        limit_req zone=lifeline_api burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/lifeline-api.access.log;
    }

    # --- 调用方入口：数据推送 ---
    location = /lifeline-docking/data-docking-api/execute/api {
        proxy_pass http://127.0.0.1:3110/data-docking-api/execute/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 2m;
        limit_req zone=lifeline_api burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/lifeline-api.access.log;
    }

    # --- 不带斜杠：301 到带斜杠，避免漏进 NewAPI 的 location / ---
    location = /lifeline-docking { return 301 /lifeline-docking/; }

    # --- 知识库：应用内部 302 到绝对路径 /kb/index.html，挂前缀后会跳飞，
    #     故在 Nginx 层直接改写成带前缀的静态路径 ---
    location = /lifeline-docking/kb { return 301 /lifeline-docking/kb/index.html; }
    location = /lifeline-docking/kb/ { return 301 /lifeline-docking/kb/index.html; }

    # --- 静态浏览：首页 + 知识库（页面用相对路径资源，代理时去掉前缀）---
    location /lifeline-docking/ {
        proxy_pass http://127.0.0.1:3110/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

}
